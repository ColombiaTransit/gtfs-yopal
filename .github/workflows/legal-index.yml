name: Municipal legal index probe
on:
  push:
    paths:
      - 'scripts/collect_legal_index.py'
      - 'scripts/diagnose_legal_index.py'
      - '.github/workflows/legal-index.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: legal-index
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install requests==2.32.5 beautifulsoup4==4.14.3 playwright
          python -m playwright install --with-deps chromium
      - name: Inspect actual municipal archive and list API
        run: python scripts/diagnose_legal_index.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yopal-legal-index
          path: archive-index/
          if-no-files-found: warn
          retention-days: 14
